<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>像素傳奇倖存者：諸神黃昏 (Pixel Legends: Ragnarok)</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <div id="hud">
    <div class="hud-row">
      <div class="hud-group">
        <span class="badge" id="heroBadge" style="color:#38bdf8;">聖殿騎士</span>
        <span class="badge" id="levelDisplay" style="color:#38bdf8;">LV. 1</span>
        <div class="hp-container"><div id="hpBar"></div></div>
      </div>
      <div class="hud-group">
        <span class="badge" id="killDisplay" style="color:#f87171;"><i class="pixel-icon" data-icon="ui_skull"></i> 0</span>
        <span class="badge" id="goldDisplay" style="color:#f59e0b;"><i class="pixel-icon" data-icon="ui_gold"></i> 0</span>
        <span class="badge" id="waveDisplay">第 1 / 100 波</span>
        <span class="badge" id="timeDisplay" style="color:#38bdf8;">00:40</span>
        <button class="icon-btn" id="pauseBtn"><i class="pixel-icon" data-icon="ui_pause"></i></button>
        <button class="icon-btn" id="audioToggleBtn"><i class="pixel-icon" data-icon="ui_audio"></i></button>
      </div>
    </div>
    <div id="eventBanner"><i class="pixel-icon" data-icon="ui_alert"></i> 特殊事件：血月狂暴！</div>
    <div class="bar-container"><div id="expBar"></div></div>
    <div id="equipmentHud"></div>
  </div>

  <div id="minimapWrapper">
    <canvas id="minimapCanvas" width="85" height="85"></canvas>
    <div id="partyReviveDisplay" class="party-revive-badge">復活：0</div>
  </div>

  <!-- 主選單 -->
  <div class="screen-overlay active" id="mainMenuScreen">
    <div class="panel-card">
      <div class="panel-title"><i class="pixel-icon" data-icon="ui_shield"></i> 像素傳奇倖存者</div>
      <div class="panel-desc">暗黑像素風格・100波極限生存・房主組隊連線大廳</div>
      <div class="menu-btn-grid">
        <button class="action-btn" id="btnGoogleLogin" style="background: #ffffff; color: #333; border-color: #ddd;">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="16" style="margin-right:8px;">
          <span id="loginText">Google 帳號登入 (雲端存檔)</span>
        </button>
        <button class="action-btn" id="btnMenuPlay"><i class="pixel-icon" data-icon="ui_sword"></i> 單人單騎出征</button>
        <button class="action-btn purple" id="btnMenuMulti"><i class="pixel-icon" data-icon="ui_globe"></i> 多人組隊大廳</button>
        <button class="action-btn emerald" id="btnMenuChar"><i class="pixel-icon" data-icon="ui_hero"></i> 英雄名冊 & 特長</button>
        <button class="action-btn" id="btnMenuMap"><i class="pixel-icon" data-icon="ui_map"></i> 冒險關卡選擇</button>
        <button class="action-btn gold" id="btnMenuTalent"><i class="pixel-icon" data-icon="ui_temple"></i> 靈魂神殿</button>
        <button class="action-btn secondary" id="btnMenuAchievements"><i class="pixel-icon" data-icon="ui_trophy"></i> 成就勳章</button>
      </div>
    </div>
  </div>

  <!-- 多人連線模式入口 -->
  <div class="screen-overlay" id="multiMatchScreen">
    <div class="panel-card">
      <div class="panel-title" style="color:#c084fc;"><i class="pixel-icon" data-icon="ui_globe"></i> 多人連線模式</div>
      <div class="panel-desc">建立房間成為房主，或輸入代碼加入隊友房間：</div>
      <div style="display:flex; flex-direction:column; gap:10px; margin-bottom:12px;">
        <button class="action-btn emerald" id="btnHostCreateRoom" style="padding:14px;"><i class="pixel-icon" data-icon="ui_host"></i> 建立新房間 (成為房主)</button>
        <div style="border-top:1px solid #1e293b; margin:4px 0; padding-top:10px; font-size:12px; color:#94a3b8;">或者加入現有房間：</div>
        <input type="text" id="joinRoomCodeInput" class="action-btn secondary" style="text-align:center; font-size:16px; letter-spacing:2px;" maxlength="6" placeholder="輸入 6 位房間代碼">
        <button class="action-btn purple" id="btnGuestJoinRoom"><i class="pixel-icon" data-icon="ui_play"></i> 加入隊友房間</button>
      </div>
      <button class="action-btn secondary" id="btnBackFromMatch">返回主選單</button>
    </div>
  </div>

  <!-- 多人房間大廳 -->
  <div class="screen-overlay" id="multiLobbyScreen">
    <div class="panel-card">
      <div class="panel-title" style="color:#a855f7;"><span>房間大廳：</span><span id="lobbyRoomCodeText" style="color:#facc15; letter-spacing:2px; text-decoration:underline;">------</span></div>
      <div class="panel-desc" id="lobbyRoleDesc">房主請等待成員準備完成後點擊開始戰鬥</div>
      <div style="font-size:11px; color:#94a3b8; text-align:left; margin-bottom:2px;">切換出戰英雄：</div>
      <div class="hero-carousel" id="lobbyHeroCarousel"></div>
      <div style="font-size:11px; color:#94a3b8; text-align:left;">隊伍成員 (<span id="lobbyPlayerCount">1</span>)：</div>
      <div class="lobby-player-grid" id="lobbyPlayerList"></div>
      <div style="display:flex; gap:8px; width:100%; margin-top:8px;">
        <button class="action-btn emerald" id="btnHostStartGame" style="flex:2; display:none;"><i class="pixel-icon" data-icon="ui_sword"></i> 🚀 開始戰鬥</button>
        <button class="action-btn gold" id="btnGuestToggleReady" style="flex:2; display:none;"><i class="pixel-icon" data-icon="ui_ready"></i> 準備就緒</button>
        <button class="action-btn crimson" id="btnLeaveLobby" style="flex:1;"><i class="pixel-icon" data-icon="ui_exit"></i> 離開</button>
      </div>
    </div>
  </div>

  <!-- 其他 Modal (選角、關卡、天賦、升級、結算) -->
  <div class="screen-overlay" id="charSelectScreen">
    <div class="panel-card">
      <div class="panel-title"><i class="pixel-icon" data-icon="ui_hero"></i> 選擇出戰英雄</div>
      <div class="hero-stage" id="heroStageBox">
        <div class="hero-preview-box"><canvas class="hero-preview-canvas" id="heroPreviewCanvas" width="24" height="30"></canvas></div>
        <div class="hero-stage-info">
          <div class="hero-stage-name"><span id="stageHeroName">聖殿騎士 亞瑟</span><span id="stageHeroWeapon" style="font-size:12px; color:#facc15;">聖靈光球</span></div>
          <div class="hero-stat-bars"><span class="stat-pill" id="stageHeroHp">生命 120</span><span class="stat-pill" id="stageHeroSpeed">移速 3.5</span></div>
          <div class="hero-stage-trait" id="stageHeroTrait">【堅毅守護】生命上限 +20%</div>
        </div>
      </div>
      <div class="hero-carousel" id="heroCarouselContainer"></div>
      <div style="display:flex; gap:8px; width:100%;">
        <button class="action-btn emerald" id="btnConfirmHero" style="flex:1;">✅ 選擇出戰</button>
        <button class="action-btn secondary" id="btnBackFromChar" style="flex:1;">返回主選單</button>
      </div>
    </div>
  </div>

  <div class="screen-overlay" id="mapSelectScreen">
    <div class="panel-card">
      <div class="panel-title"><i class="pixel-icon" data-icon="ui_map"></i> 選擇冒險戰場</div>
      <div class="selection-grid" id="mapListContainer"></div>
      <button class="action-btn secondary" id="btnBackFromMap">確認並返回</button>
    </div>
  </div>

  <div class="modal-overlay" id="talentModal">
    <div class="panel-card">
      <div class="panel-title" style="color:#f59e0b;"><i class="pixel-icon" data-icon="ui_temple"></i> 靈魂神殿</div>
      <div class="panel-desc" id="talentGoldStatus">目前金幣儲備：0</div>
      <div class="talent-list" id="talentOptionsList"></div>
      <button class="action-btn secondary" id="closeTalentBtn" style="margin-top:10px;">返回主選單</button>
    </div>
  </div>

  <div class="modal-overlay" id="achievementModal">
    <div class="panel-card">
      <div class="panel-title" style="color:#a855f7;"><i class="pixel-icon" data-icon="ui_trophy"></i> 英雄成就與獎勵</div>
      <div class="achievement-list" id="achievementListContainer"></div>
      <button class="action-btn secondary" id="closeAchievementBtn" style="margin-top:10px;">返回主選單</button>
    </div>
  </div>

  <div class="modal-overlay" id="upgradeModal">
    <div class="panel-card">
      <div class="panel-title" id="upgradeTitle">⚡ 等級突破！</div>
      <div class="panel-desc">選擇一項強化 (按 1/2/3 鍵快速選擇)：</div>
      <div class="skill-list" id="skillOptionsList"></div>
    </div>
  </div>

  <div class="modal-overlay" id="endModal">
    <div class="panel-card">
      <div class="panel-title" id="endTitle">戰鬥結束</div>
      <div class="panel-desc" id="endDesc">戰況統計</div>
      <div style="display:flex; justify-content:center; gap:8px; margin-top:10px;">
        <button class="action-btn" id="restartBtn">再次出征</button>
        <button class="action-btn secondary" id="endBackMenuBtn">主選單</button>
      </div>
    </div>
  </div>

  <div id="joystickZone"><div id="joystickBase"></div><div id="joystickStick"></div></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
